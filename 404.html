<html>

<head>
    <title>DSA Digital</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <meta name="description" content="DSA Digital - Ajudando a crescer seu negócio" />
    <meta name="author" content="yLorde" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="DSA Digital" />
    <meta property="og:description" content="DSA Digital - Ajudando a crescer seu negócio" />
    <meta property="og:type" content="website" />

    <script>
        // Captura o caminho original antes de cair no 404
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var redirect = path + search + hash;

        // Salva o caminho original no sessionStorage
        sessionStorage.setItem("redirect", redirect);

        // Redireciona para o index.html
        window.location.replace("/");
    </script>
</head>

</html>
